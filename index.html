<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#000000" />
  <title>Yapı Kredi Mobil</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-theme="dark">
  <!-- Masaüstünde telefon çerçevesi, telefonda tam ekran -->
  <div id="device">
    <div id="phone">
      <!-- Sahte iOS durum çubuğu -->
      <div class="statusbar">
        <span class="sb-time" id="sb-time">09:41</span>
        <span class="sb-notch"></span>
        <span class="sb-right">
          <svg width="18" height="11" viewBox="0 0 18 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="5" y="4.5" width="3" height="6.5" rx="1"/><rect x="10" y="2" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="11" rx="1"/></svg>
          <span class="sb-5g">5G</span>
          <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="3" stroke="currentColor" opacity="0.5"/><rect x="2" y="2" width="17" height="8" rx="1.5" fill="currentColor"/><rect x="23" y="4" width="2" height="4" rx="1" fill="currentColor" opacity="0.5"/></svg>
        </span>
      </div>

      <!-- Ekranların yerleşeceği alan -->
      <main id="app"></main>

      <!-- Soldan açılan menü (drawer) -->
      <div id="scrim" class="scrim"></div>
      <aside id="drawer" class="drawer"></aside>

      <!-- Alttan açılan onay / modal katmanı -->
      <div id="sheet-scrim" class="scrim"></div>
      <div id="sheet" class="sheet"></div>

      <!-- Toast -->
      <div id="toast" class="toast"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
